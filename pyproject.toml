[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sstrack"
dynamic = ["version"]
description = "Static Segmentation by Tracking: segment biological specimen traits by propagating a reference mask with SAM2."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "David Carlyn", email = "davidecarlyn@gmail.com" },
    { name = "Matthew J. Thompson", email = "thompson.m.j@outlook.com" },
]
keywords = [
    "imageomics",
    "segmentation",
    "sam2",
    "tracking",
    "specimen",
    "biology",
    "computer-vision",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch",
    "torchvision",
    "transformers>=4.56",
    "pillow",
    "numpy",
    "opencv-python-headless",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
raw = ["rawpy"]
dev = ["pytest", "ruff", "pre-commit"]

[project.scripts]
sst = "sst.__main__:main"

[project.urls]
Source = "https://github.com/Imageomics/SST"
Issues = "https://github.com/Imageomics/SST/issues"

[tool.hatch.version]
path = "src/sst/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sst"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/sst",
    "/README.md",
    "/LICENSE.md",
    "/CITATION.cff",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["experiments", "gui", "GroundingDINO", "segment-anything-2"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
